name: Restore full settings no Cloud SQL

on:
  workflow_dispatch:
  push:
    paths:
      - "_restore/TRIGGER_SETTINGS_RESTORE"

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore settings.tsx from known-good commit
        run: |
          git show d48afdadae2505ec10e4a61ffc0483e92c45db11:src/routes/settings.tsx > src/routes/settings.tsx
          wc -c src/routes/settings.tsx

      - name: Strip Cloud SQL UI branches
        run: python3 scripts/strip-settings-cloudsql.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/routes/settings.tsx
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: restore full settings.tsx without Cloud SQL UI (D1 primary)"
            git push
          fi
