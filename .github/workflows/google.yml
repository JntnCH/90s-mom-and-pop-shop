name: "Build and Deploy to Google Cloud Run"

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - ".prettierrc"
      - ".prettierignore"
      - "docs/**"
  workflow_dispatch:

env:
  PROJECT_ID: "openclaw-gcp-272026"
  GAR_LOCATION: "asia-southeast3"
  REGION: "asia-southeast1"
  SERVICE_NAME: "a-1990s-style-mom-and-pop-shop"
  REPOSITORY: "a-1990s-style-mom-and-pop-shop"
  IMAGE_NAME: "a-1990s-style-mom-and-pop-shop"
  WORKLOAD_IDENTITY_PROVIDER: "projects/1078213755629/locations/global/workloadIdentityPools/myworktracking/providers/workload-github"

jobs:
  diff-check-and-deploy:
    name: "Setup, Build, Publish, and Deploy to Cloud Run"
    runs-on: "ubuntu-latest"

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: "Checkout code"
        uses: "actions/checkout@v4"
        with:
          fetch-depth: 2

      - name: "Run Incremental Diff Check"
        id: "diff"
        run: |
          node scripts/incremental-deploy.mjs

      # Authenticate to Google Cloud (Workload Identity Federation or Service Account Key)
      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v2"
        with:
          project_id: "${{ env.PROJECT_ID }}"
          credentials_json: "${{ secrets.GCP_SA_KEY || secrets.GCP_CREDENTIALS || '' }}"
          workload_identity_provider: "${{ env.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.GCP_SERVICE_ACCOUNT || '' }}"
          token_format: "access_token"

      # Set up gcloud CLI
      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v2"

      # Authenticate Docker to Google Artifact Registry
      - name: "Configure Docker for Artifact Registry"
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # Set up Docker Buildx for faster cached builds
      - name: "Set up Docker Buildx"
        uses: "docker/setup-buildx-action@v3"

      # Build and Push Docker container
      - name: "Build and push Docker container"
        uses: "docker/build-push-action@v5"
        with:
          context: "."
          push: true
          build-args: |
            VITE_LINE_LIFF_ID=${{ secrets.VITE_LINE_LIFF_ID || secrets.LINE_LIFF_ID }}
            LINE_LIFF_ID=${{ secrets.LINE_LIFF_ID || secrets.VITE_LINE_LIFF_ID }}
            LINE_CHANNEL_ACCESS_TOKEN=${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
            LINE_CHANNEL_SECRET=${{ secrets.LINE_CHANNEL_SECRET }}
            LINE_CHANNEL_ID=${{ secrets.LINE_CHANNEL_ID }}
            LINE_TO_ID=${{ secrets.LINE_TO_ID }}
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

      # Apply the additive schema change before deploying code that depends on it
      - name: "Install PostgreSQL client"
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: "Apply database migration"
        env:
          INSTANCE_CONNECTION_NAME: "openclaw-gcp-272026:asia-southeast1:minimark-2026"
          PGDATABASE: "postgres"
          PGUSER: ${{ secrets.SQL_ADMIN_USER }}
          PGPASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          PGSSLMODE: disable
          SQL_HOST: "/home/runner/work/_temp/cloudsql/openclaw-gcp-272026:asia-southeast1:minimark-2026"
          SQL_DB_NAME: "postgres"
          SQL_ADMIN_USER: ${{ secrets.SQL_ADMIN_USER }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          proxy_dir="${RUNNER_TEMP}/cloudsql"
          socket_dir="${proxy_dir}/${INSTANCE_CONNECTION_NAME}"
          proxy_binary="${RUNNER_TEMP}/cloud-sql-proxy"
          proxy_log="${RUNNER_TEMP}/cloud-sql-proxy.log"

          mkdir -p "$proxy_dir"
          curl --fail --silent --show-error --location \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.26.0/cloud-sql-proxy.linux.amd64" \
            --output "$proxy_binary"
          chmod +x "$proxy_binary"

          "$proxy_binary" --unix-socket "$proxy_dir" "$INSTANCE_CONNECTION_NAME" >"$proxy_log" 2>&1 &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT

          export PGHOST="$socket_dir"
          for attempt in $(seq 1 30); do
            if [ -S "$socket_dir/.s.PGSQL.5432" ]; then
              break
            fi
            if ! kill -0 "$proxy_pid" 2>/dev/null; then
              echo "Cloud SQL Auth Proxy stopped before creating the Unix socket." >&2
              cat "$proxy_log" >&2
              exit 1
            fi
            sleep 1
          done

          if [ ! -S "$socket_dir/.s.PGSQL.5432" ]; then
            echo "Cloud SQL Auth Proxy did not create the PostgreSQL Unix socket in time." >&2
            cat "$proxy_log" >&2
            exit 1
          fi

          export DATABASE_URL="postgres://${PGUSER}:${PGPASSWORD}@/${PGDATABASE}?host=${socket_dir}"

          npm ci
          npx drizzle-kit push --config=src/db/drizzle.config.ts --force

          psql --no-psqlrc --set=ON_ERROR_STOP=1 --file=drizzle/0000_add_subcategories.sql || \
            echo "Note: subcategories migration skipped (may already be applied by push)"

      # Deploy the Docker image to Google Cloud Run
      - id: "deploy"
        name: "Deploy to Google Cloud Run"
        uses: "google-github-actions/deploy-cloudrun@v2"
        with:
          service: "${{ env.SERVICE_NAME }}"
          image: "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          region: "${{ env.REGION }}"
          flags: "--allow-unauthenticated --port=8080 --cpu=1 --memory=512Mi --min-instances=1 --max-instances=2 --add-cloudsql-instances=openclaw-gcp-272026:asia-southeast1:minimark-2026"
          env_vars: |
            LINE_LIFF_ID=${{ secrets.LINE_LIFF_ID || secrets.VITE_LINE_LIFF_ID }}
            VITE_LINE_LIFF_ID=${{ secrets.VITE_LINE_LIFF_ID || secrets.LINE_LIFF_ID }}
            LINE_CHANNEL_ACCESS_TOKEN=${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
            LINE_CHANNEL_SECRET=${{ secrets.LINE_CHANNEL_SECRET }}
            LINE_CHANNEL_ID=${{ secrets.LINE_CHANNEL_ID }}
            LINE_TO_ID=${{ secrets.LINE_TO_ID }}
            SQL_HOST=/cloudsql/openclaw-gcp-272026:asia-southeast1:minimark-2026
            SQL_USER=${{ secrets.SQL_ADMIN_USER }}
            SQL_PASSWORD=${{ secrets.SQL_ADMIN_PASSWORD }}
            SQL_DB_NAME=postgres
            SQL_ADMIN_USER=${{ secrets.SQL_ADMIN_USER }}
            SQL_ADMIN_PASSWORD=${{ secrets.SQL_ADMIN_PASSWORD }}
            DB_USER=${{ secrets.SQL_ADMIN_USER }}
            DB_PASSWORD=${{ secrets.SQL_ADMIN_PASSWORD }}
            DB_NAME=postgres
            INSTANCE_CONNECTION_NAME=openclaw-gcp-272026:asia-southeast1:minimark-2026
            GOOGLE_SERVICE_ACCOUNT_JSON=${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GCP_SA_KEY || secrets.GCP_CREDENTIALS || secrets.SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
            GOOGLE_SERVICE_ACCOUNT_EMAIL=${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL || secrets.SERVICE_ACCOUNT_EMAIL || secrets.GCP_SERVICE_ACCOUNT }}
            GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY=${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY || secrets.SERVICE_ACCOUNT_PRIVATE_KEY || secrets.GOOGLE_PRIVATE_KEY }}
            GOOGLE_SPREADSHEET_ID=${{ secrets.GOOGLE_SPREADSHEET_ID || secrets.SPREADSHEET_ID || secrets.GOOGLE_SHEET_ID || secrets.SHEET_ID }}


      # Explicitly grant public unauthenticated access (allUsers)
      - name: "Ensure Public Access (allUsers)"
        run: |
          gcloud run services add-iam-policy-binding "${{ env.SERVICE_NAME }}" \
            --region="${{ env.REGION }}" \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --quiet || echo "IAM binding notice: allUsers might already be bound or governed by org policy"

      # Display the deployed Cloud Run service URL
      - name: "Display Service URL"
        run: |
          echo "=============================================="
          echo "🎉 Service successfully deployed to Cloud Run!"
          echo "Service URL: ${{ steps.deploy.outputs.url }}"
          echo "=============================================="
          echo "### 🚀 Cloud Run Live URL" >> $GITHUB_STEP_SUMMARY
          echo "[Open Application](${{ steps.deploy.outputs.url }})" >> $GITHUB_STEP_SUMMARY
