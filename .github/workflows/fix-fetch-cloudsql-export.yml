name: fix-fetchCloudSqlSnapshotFn-export
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Insert missing export
        run: |
          python3 -c "
          from pathlib import Path
          path = Path('src/lib/line-server-fn.ts')
          text = path.read_text(encoding='utf-8')
          if 'fetchCloudSqlSnapshotFn' in text:
              print('Already present')
              raise SystemExit(0)
          needle = 'export const getLineFollowersHistoryFn'
          insert = '''/**\n * Fetch complete database snapshot from Cloud SQL / D1 (with memory fallback)\n */\nexport const fetchCloudSqlSnapshotFn = createServerFn({ method: \"GET\" }).handler(async () => {\n  try {\n    const snapshot = await getDatabaseSnapshot();\n    return {\n      success: true,\n      data: snapshot,\n      source: \"d1\" as const,\n    };\n  } catch (error) {\n    return {\n      success: false,\n      error: error instanceof Error ? error.message : String(error),\n      data: globalServerDatabase,\n      source: \"memory\" as const,\n    };\n  }\n});\n\n'''
          if needle not in text:
              raise SystemExit('needle not found')
          path.write_text(text.replace(needle, insert + needle, 1), encoding='utf-8')
          print('Inserted fetchCloudSqlSnapshotFn')
          "
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/line-server-fn.ts
          git diff --cached --stat
          git commit -m "fix: export fetchCloudSqlSnapshotFn (unbreak vite build)" || echo "No changes"
          git push origin main
