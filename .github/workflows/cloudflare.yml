# Cloudflare Workers deploy — separate from Cloud Run (google.yml)
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure line-server-fn is complete + D1 patches
        run: |
          LINES=$(wc -l < src/lib/line-server-fn.ts || echo 0)
          SAFE=0
          if grep -q "isD1Available" src/lib/line-server-fn.ts \
            && grep -q "getDatabaseInspectionFn" src/lib/line-server-fn.ts \
            && ! grep -q 'from "node:fs"' src/lib/line-server-fn.ts \
            && ! grep -q 'from "node:path"' src/lib/line-server-fn.ts \
            && ! grep -q 'db-service' src/lib/line-server-fn.ts; then
            SAFE=1
          fi
          if [ "$LINES" -lt 500 ] && [ "$SAFE" -eq 0 ]; then
            echo "line-server-fn.ts looks truncated ($LINES lines) — restoring baseline"
            curl --fail -sL "https://raw.githubusercontent.com/JntnCH/90s-mom-and-pop-shop/efc4e9a3dccae330752988309818da07951c7c37/src/lib/line-server-fn.ts" -o src/lib/line-server-fn.ts.bak && mv src/lib/line-server-fn.ts.bak src/lib/line-server-fn.ts || true
          else
            echo "line-server-fn.ts kept as-is (lines=$LINES safe=$SAFE)"
          fi
          node scripts/apply-d1-line-server-fn.mjs

      - name: Restore products.tsx if truncated + guard sellPrice
        run: |
          python3 << 'PY'
          from pathlib import Path
          import urllib.request
          p = Path("src/routes/products.tsx")
          text = p.read_text() if p.exists() else ""
          # Restore if placeholder / truncated
          if (not p.exists()) or len(text) < 5000 or "PLACEHOLDER" in text or "createFileRoute" not in text:
              url = "https://raw.githubusercontent.com/JntnCH/90s-mom-and-pop-shop/444f7a86c027a43e9e353431c14a7a9450fbabe1/src/routes/products.tsx"
              print("Restoring products.tsx from known good commit")
              text = urllib.request.urlopen(url, timeout=60).read().decode("utf-8")
              p.write_text(text)

          src = p.read_text()
          helper = '''
function money(n: unknown): string {
  const v = typeof n === "number" && !Number.isNaN(n) ? n : Number(n);
  const safe = Number.isFinite(v) ? v : 0;
  return safe.toLocaleString("th-TH", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

function money2(n: unknown): string {
  const v = typeof n === "number" && !Number.isNaN(n) ? n : Number(n);
  const safe = Number.isFinite(v) ? v : 0;
  return safe.toLocaleString("th-TH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

'''
          if "function money(" not in src:
              src = src.replace(
                  'export const Route = createFileRoute("/products")',
                  helper + 'export const Route = createFileRoute("/products")',
              )

          reps = [
              ('฿{p.sellPrice.toLocaleString("th-TH")}', '฿{money(p.sellPrice)}'),
              ('`฿${product.costPrice.toLocaleString("th-TH", { minimumFractionDigits: 2 })}`', '`฿${money2(product.costPrice)}`'),
              ('฿{product.sellPrice.toLocaleString("th-TH", { minimumFractionDigits: 2 })}', '฿{money2(product.sellPrice)}'),
          ]
          for a, b in reps:
              src = src.replace(a, b)

          old_load = "setProducts(MasterStore.getProducts());"
          new_load = """setProducts(
      MasterStore.getProducts().map((p) => ({
        ...p,
        costPrice: typeof p.costPrice === "number" ? p.costPrice : Number(p.costPrice) || 0,
        sellPrice: typeof p.sellPrice === "number" ? p.sellPrice : Number(p.sellPrice) || 0,
        stock: typeof p.stock === "number" ? p.stock : Number(p.stock) || 0,
        minStock: typeof p.minStock === "number" ? p.minStock : Number(p.minStock) || 0,
        targetStock: typeof p.targetStock === "number" ? p.targetStock : Number(p.targetStock) || 0,
        reorderQuantity:
          typeof p.reorderQuantity === "number" ? p.reorderQuantity : Number(p.reorderQuantity) || 0,
      })),
    );"""
          if old_load in src and "Number(p.sellPrice)" not in src:
              src = src.replace(old_load, new_load, 1)

          p.write_text(src)
          print("products.tsx patched: money helpers + numeric normalize")
          if "sellPrice.toLocaleString" in src:
              print("WARNING: still has sellPrice.toLocaleString")
          else:
              print("OK: no unsafe sellPrice.toLocaleString")
          PY

      - name: Apply primary supplier default (บจก ไทรงามช้อบ)
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/routes/reorder.tsx")
          if not p.exists():
              raise SystemExit(0)
          src = p.read_text()
          primary = "บจก ไทรงามช้อบ"
          src = src.replace('useState("บจก ไทรงามช้อป")', f'useState("{primary}")')
          src = src.replace('useState("บจก ไทรงามช้อบ")', f'useState("{primary}")')
          src = src.replace("บจก ไทรงามช้อป", primary)
          src = src.replace(
              'setSupplierNameInput(activePO.supplierName || "")',
              f'setSupplierNameInput(activePO.supplierName || "{primary}")',
          )
          src = src.replace(
              'setSupplierNameInput(po.supplierName || "")',
              f'setSupplierNameInput(po.supplierName || "{primary}")',
          )
          src = src.replace('setSupplierNameInput("")', f'setSupplierNameInput("{primary}")')
          p.write_text(src)
          print("primary supplier applied:", primary)
          PY

      - name: Prune oversized assets (> 20MB) to satisfy Cloudflare limit
        run: |
          rm -rf public/assets/aistudio .output/public/assets/aistudio || true
          find public -type f -size +20M -delete || true

      - name: Build (Cloudflare Workers / Nitro)
        env:
          NITRO_PRESET: cloudflare-module
          NODE_ENV: production
          VITE_LINE_LIFF_ID: ${{ secrets.LINE_LIFF_ID || secrets.VITE_LINE_LIFF_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID || secrets.SPREADSHEET_ID || secrets.GOOGLE_SHEET_ID || secrets.SHEET_ID }}
        run: |
          npm run build
          node scripts/patch-cloudflare-worker.mjs || true
          find .output/public -type f -size +20M -delete || true

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-build
          path: |
            .output/
            .wrangler/
            wrangler.jsonc
          retention-days: 3

      - name: Check Cloudflare credentials
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set. Add it at Repo Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'a6d009b2d02da90d095336d68e378377' }}
          command: deploy
          packageManager: npm

      - name: Sync GitHub Secrets to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'a6d009b2d02da90d095336d68e378377' }}
        run: |
          set +e
          sync_secret() {
            local key="$1"
            local val="$2"
            if [ -n "$val" ]; then
              echo "Syncing secret $key to Cloudflare Worker..."
              echo "$val" | npx wrangler secret put "$key" || echo "Notice: Could not sync $key"
            fi
          }
          sync_secret "GOOGLE_SERVICE_ACCOUNT_JSON" "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GCP_SA_KEY || secrets.GCP_CREDENTIALS || secrets.SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}"
          sync_secret "GOOGLE_SERVICE_ACCOUNT_EMAIL" "${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL || secrets.SERVICE_ACCOUNT_EMAIL || secrets.GCP_SERVICE_ACCOUNT }}"
          sync_secret "GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY" "${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY || secrets.SERVICE_ACCOUNT_PRIVATE_KEY || secrets.GOOGLE_PRIVATE_KEY }}"
          sync_secret "GOOGLE_SPREADSHEET_ID" "${{ secrets.GOOGLE_SPREADSHEET_ID || secrets.SPREADSHEET_ID || secrets.GOOGLE_SHEET_ID || secrets.SHEET_ID }}"
          sync_secret "LINE_CHANNEL_ACCESS_TOKEN" "${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}"
          sync_secret "LINE_CHANNEL_SECRET" "${{ secrets.LINE_CHANNEL_SECRET }}"
          sync_secret "LINE_CHANNEL_ID" "${{ secrets.LINE_CHANNEL_ID }}"
          sync_secret "LINE_TO_ID" "${{ secrets.LINE_TO_ID }}"
          sync_secret "LINE_LIFF_ID" "${{ secrets.LINE_LIFF_ID || secrets.VITE_LINE_LIFF_ID }}"
          set -e
