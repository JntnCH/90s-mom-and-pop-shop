# Cloudflare Workers deploy — separate from Cloud Run (google.yml)
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure line-server-fn is complete + D1 patches
        run: |
          LINES=$(wc -l < src/lib/line-server-fn.ts || echo 0)
          if [ "$LINES" -lt 500 ]; then
            echo "line-server-fn.ts looks truncated ($LINES lines) — restoring baseline"
            curl -sL "https://raw.githubusercontent.com/JntnCH/90s-mom-and-pop-shop/efc4e9a3dccae330752988309818da07951c7c37/src/lib/line-server-fn.ts" -o src/lib/line-server-fn.ts
          fi
          node scripts/apply-d1-line-server-fn.mjs

      - name: Prune oversized assets (> 20MB) to satisfy Cloudflare limit
        run: |
          rm -rf public/assets/aistudio .output/public/assets/aistudio || true
          find public -type f -size +20M -delete || true

      - name: Build (Cloudflare Workers / Nitro)
        env:
          NITRO_PRESET: cloudflare-module
          NODE_ENV: production
          VITE_LINE_LIFF_ID: ${{ secrets.LINE_LIFF_ID || secrets.VITE_LINE_LIFF_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
        run: |
          npm run build
          find .output/public -type f -size +20M -delete || true

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-build
          path: |
            .output/
            .wrangler/
            wrangler.jsonc
          retention-days: 3

      - name: Check Cloudflare credentials
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set. Add it at Repo Settings → Secrets and variables → Actions."
            echo "Create token at: https://developers.cloudflare.com/fundamentals/api/get-started/create-token/"
            echo "Recommended template: Edit Cloudflare Workers"
            echo "Account ID: a6d009b2d02da90d095336d68e378377"
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          packageManager: npm

      - name: Sync GitHub Secrets to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          sync_secret() {
            local key="$1"
            local val="$2"
            if [ -n "$val" ]; then
              echo "Syncing secret $key to Cloudflare Worker..."
              echo "$val" | npx wrangler secret put "$key" || echo "Notice: Could not sync $key"
            fi
          }
          sync_secret "GOOGLE_SERVICE_ACCOUNT_JSON" "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}"
          sync_secret "GOOGLE_SERVICE_ACCOUNT_EMAIL" "${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}"
          sync_secret "GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY" "${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}"
          sync_secret "GOOGLE_SPREADSHEET_ID" "${{ secrets.GOOGLE_SPREADSHEET_ID }}"
          sync_secret "LINE_CHANNEL_ACCESS_TOKEN" "${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}"
          sync_secret "LINE_CHANNEL_SECRET" "${{ secrets.LINE_CHANNEL_SECRET }}"
          sync_secret "LINE_LIFF_ID" "${{ secrets.LINE_LIFF_ID || secrets.VITE_LINE_LIFF_ID }}"
          set -e
