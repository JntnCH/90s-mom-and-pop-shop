name: Apply category persist v4

on:
  push:
    paths:
      - ".github/workflows/apply-category-v4.yml"
      - "scripts/patch-category-v4.py"
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply v4 patch
        run: python3 scripts/patch-category-v4.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/reorder.tsx src/lib/store.ts
          git status
          git diff --stat
          git commit -m "fix(reorder/store): category persist v4 — EditPO/SavePO keep category + pending patches" || echo "no changes"
          git push origin HEAD:main
