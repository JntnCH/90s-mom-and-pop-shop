name: Restore reorder unitName fix
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply unitName sync fix to reorder.tsx
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
          path = Path("src/routes/reorder.tsx")
          text = path.read_text()
          # Ensure we have the full file (not placeholder)
          if len(text) < 100000:
              text = Path("/dev/null").read_text() if False else None
              import subprocess
              text = subprocess.check_output(
                  ["git", "show", "ce0d88e457bfedbd148bb78f9901e78bcc6e3dc4:src/routes/reorder.tsx"],
                  text=True,
              )
              path.write_text(text)
              text = path.read_text()
          old1 = """  const handleUpdateUnit = (productId: string, unitId: string) => {
    setOrderList((prev) =>
      prev.map((item) => (item.productId === productId ? { ...item, unitId } : item)),
    );
  };"""
          new1 = """  const handleUpdateUnit = (productId: string, unitId: string) => {
    setOrderList((prev) =>
      prev.map((item) =>
        item.productId === productId
          ? { ...item, unitId, unitName: getUnitName(unitId) }
          : item,
      ),
    );
  };"""
          old2 = """    const effectiveUnitId = item.unitId || product?.unitId || units[0]?.id || \"unit-piece\";
    const effectiveUnitName = item.unitName || getUnitName(effectiveUnitId);"""
          new2 = """    const effectiveUnitId = item.unitId || product?.unitId || units[0]?.id || \"unit-piece\";
    // unitId is source of truth (inline dropdown); always resolve name so export/preview stay in sync
    const effectiveUnitName = getUnitName(effectiveUnitId) || item.unitName || \"-\";"""
          if old1 not in text:
              raise SystemExit("old1 not found")
          if old2 not in text:
              raise SystemExit("old2 not found")
          text = text.replace(old1, new1, 1).replace(old2, new2, 1)
          path.write_text(text)
          assert "unitName: getUnitName(unitId)" in text
          assert "getUnitName(effectiveUnitId) || item.unitName" in text
          print("patched ok", path.stat().st_size)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/routes/reorder.tsx
          git status
          git commit -m "fix(reorder): sync unitName when changing unit on cart so export/preview use latest PO units" || echo "no change"
          git push
