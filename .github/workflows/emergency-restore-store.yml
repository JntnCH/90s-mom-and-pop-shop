name: Emergency restore store reorder

on:
  push:
    paths:
      - ".github/workflows/emergency-restore-store.yml"
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore store.ts from last known good commit
        run: |
          set -euo pipefail
          curl -sL "https://raw.githubusercontent.com/JntnCH/90s-mom-and-pop-shop/fb342415da4d91201e2df8c29aa8a9b423e8ac31/src/lib/store.ts" -o src/lib/store.ts
          wc -c src/lib/store.ts
          grep -n checkDuplicateSku src/lib/store.ts | head -3

      - name: Inject getSmartReorderForecast if missing
        run: |
          set -euo pipefail
          python3 scripts/inject-smart-reorder.py

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/store.ts
          git status
          git diff --stat || true
          git commit -m "fix: emergency restore store.ts (checkDuplicate + getSmartReorderForecast)" || echo "no changes"
          git push origin HEAD:main
