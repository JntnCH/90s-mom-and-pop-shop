name: Emergency restore store reorder

on:
  push:
    paths:
      - ".github/workflows/emergency-restore-store.yml"
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore store.ts
        run: |
          curl -sL "https://raw.githubusercontent.com/JntnCH/90s-mom-and-pop-shop/32f99ffeae255d901269f4a335ac7d9d99de9a24/src/lib/store.ts" -o src/lib/store.ts
          python3 scripts/fix-store-perf.py || true
          wc -c src/lib/store.ts
          grep -c updateProduct src/lib/store.ts

      - name: Restore reorder.tsx from good commit
        run: |
          git show bcfe641f9c7cb79f6b3488249cbcdf04d4dbeca2:src/routes/reorder.tsx > src/routes/reorder.tsx
          wc -c src/routes/reorder.tsx

      - name: Apply optimistic category patch
        run: |
          python3 scripts/patch-reorder-category.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/store.ts src/routes/reorder.tsx
          git status
          git diff --stat
          git commit -m "fix: restore MasterStore + immediate category update on PO item save" || echo "no changes"
          git push origin HEAD:main
